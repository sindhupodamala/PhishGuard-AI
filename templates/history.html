<!DOCTYPE html>
<html>
<head>
    <title>PhishGuard AI - History</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f5fa;
            padding: 30px;
        }

        h1 {
            color: #173b70;
            text-align: center;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #173b70;
            color: white;
        }
    </style>
</head>
<body>

    <h1>PhishGuard AI - Detection History</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>URL</th>
            <th>Result</th>
            <th>Confidence</th>
            <th>Date & Time</th>
        </tr>

        {% for record in records %}
        <tr>
            <td>{{ record[0] }}</td>
            <td>{{ record[1] or '-' }}</td>
            <td>{{ record[5] or '-' }}</td>
            <td>{{ record[2] }}</td>
            <td>{{ record[3] if record[3] is not none else '-' }}</td>
            <td>{{ record[4] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
